<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mellow Note - シンプルなメモ帳</title>
  <!-- 落ち着いた丸みのあるGoogleフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* 落ち着きのあるラテ＆アイボリー配色 */
      --bg-main: #FAF8F5;
      --bg-sidebar: #F3EFEA;
      --bg-card: #FFFFFF;
      --bg-hover: #EAE4DC;
      --bg-active: #E5DDD3;
      --text-main: #4A4238;
      --text-muted: #8C8275;
      --text-light: #B5ACA0;
      --accent: #C89D7C;
      --accent-hover: #B88B68;
      --accent-soft: #F4EAE1;
      --danger: #D97A7A;
      --danger-soft: #FAEBEB;
      --border: #E6DFD5;
      --shadow: 0 4px 12px rgba(74, 66, 56, 0.05);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* アプリ全体のコンテナ */
    .app-container {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      display: flex;
      background-color: var(--bg-main);
      box-shadow: 0 0 30px rgba(74, 66, 56, 0.04);
    }

    /* ================= サイドバー（メモ一覧） ================= */
    .sidebar {
      width: 340px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 20px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.03em;
    }

    .app-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background-color: var(--accent-soft);
      color: var(--accent);
      border-radius: 10px;
      font-size: 1.1rem;
    }

    .btn-new {
      background-color: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      padding: 8px 14px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(200, 157, 124, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-new:hover {
      background-color: var(--accent-hover);
    }

    .btn-new:active {
      transform: scale(0.97);
    }

    /* 検索ボックス */
    .search-box {
      padding: 0 20px 14px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-light);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: var(--text-light);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* 件数表示バー */
    .list-meta {
      padding: 0 22px 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* メモリスト */
    .note-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-list::-webkit-scrollbar {
      width: 6px;
    }
    .note-list::-webkit-scrollbar-thumb {
      background-color: var(--border);
      border-radius: 3px;
    }

    .note-card {
      background-color: var(--bg-card);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(74, 66, 56, 0.02);
      position: relative;
    }

    .note-card:hover {
      background-color: #FCFBF9;
      border-color: var(--border);
      transform: translateY(-1px);
    }

    .note-card.active {
      background-color: var(--accent-soft);
      border-color: var(--accent);
    }

    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .note-card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pin-badge {
      color: var(--accent);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .note-card-preview {
      font-size: 0.83rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
      min-height: 1.2em;
    }

    .note-card-date {
      font-size: 0.72rem;
      color: var(--text-light);
    }

    /* 空状態 */
    .empty-list {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    /* ================= メイン（エディタ画面） ================= */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      height: 100%;
      position: relative;
    }

    .editor-toolbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background-color: var(--bg-main);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back {
      display: none; /* PCでは非表示 */
      background: none;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      align-items: center;
      gap: 4px;
    }

    .save-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #98B898;
      transition: background-color 0.3s;
    }

    .status-dot.saving {
      background-color: var(--accent);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .btn-icon.pinned {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .btn-icon.delete:hover {
      background-color: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* エディタ本文入力エリア */
    .editor-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 36px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
    }

    .editor-date-info {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 12px;
    }

    .input-title {
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .input-title::placeholder {
      color: var(--text-light);
    }

    .input-body {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 1.02rem;
      color: var(--text-main);
      outline: none;
      resize: none;
      line-height: 1.85;
      letter-spacing: 0.02em;
    }

    .input-body::placeholder {
      color: var(--text-light);
    }

    .editor-footer {
      padding: 12px 36px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* メモ未選択時のプレースホルダー */
    .no-note-selected {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 14px;
      padding: 20px;
      text-align: center;
    }

    .no-note-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background-color: var(--bg-sidebar);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--accent);
    }

    /* ================= スマホ向けレスポンシブ設定 ================= */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        border-right: none;
      }

      .editor-area {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        z-index: 10;
        transform: translateX(100%);
        transition: transform 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      .app-container.mobile-editing .editor-area {
        transform: translateX(0);
      }

      .btn-back {
        display: inline-flex;
      }

      .editor-toolbar {
        padding: 12px 16px;
      }

      .editor-content {
        padding: 20px 20px;
      }

      .input-title {
        font-size: 1.35rem;
      }

      .editor-footer {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- 左ペイン：メモ一覧 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="app-title">
          <span class="app-title-icon">✎</span>
          <span>Mellow Note</span>
        </div>
        <button class="btn-new" id="btnNewNote">
          <span>＋</span> 新規メモ
        </button>
      </div>

      <div class="search-box">
        <div class="search-input-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="メモを検索...">
        </div>
      </div>

      <div class="list-meta">
        <span id="noteCountLabel">すべてのメモ (0件)</span>
        <span id="syncModeLabel">ローカル保存</span>
      </div>

      <div class="note-list" id="noteList">
        <!-- メモカードがここに動的に生成されます -->
      </div>
    </aside>

    <!-- 右ペイン：エディタ -->
    <main class="editor-area">
      <!-- メモ選択時の表示 -->
      <div id="editorWrapper" style="display: none; flex-direction: column; height: 100%;">
        <header class="editor-toolbar">
          <div class="toolbar-left">
            <button class="btn-back" id="btnBack">
              ← 一覧へ
            </button>
            <div class="save-status">
              <span class="status-dot" id="statusDot"></span>
              <span id="saveStatusText">保存済み</span>
            </div>
          </div>

          <div class="toolbar-right">
            <button class="btn-icon" id="btnPin" title="上部に固定">
              📌 <span id="pinBtnText">ピン留め</span>
            </button>
            <button class="btn-icon delete" id="btnDelete" title="このメモを削除">
              🗑 削除
            </button>
          </div>
        </header>

        <div class="editor-content">
          <div class="editor-date-info" id="editorDateInfo"></div>
          <input type="text" class="input-title" id="inputTitle" placeholder="タイトルを入力...">
          <textarea class="input-body" id="inputBody" placeholder="ここに自由に書き留めましょう..."></textarea>
        </div>

        <footer class="editor-footer">
          <span id="charCount">0 文字</span>
        </footer>
      </div>

      <!-- メモ未選択時の表示 -->
      <div class="no-note-selected" id="noNoteView">
        <div class="no-note-icon">☕</div>
        <p>左の一覧からメモを選ぶか、<br>「＋ 新規メモ」から書き始めましょう。</p>
      </div>
    </main>
  </div>

  <script>
    /**
     * =========================================================================
     * データ保存層（StorageService）
     * -------------------------------------------------------------------------
     * 【Firebase移行時のポイント】
     * のちにFirebase (Cloud Firestore) へ移行する際は、この StorageService 内の
     * 4つのメソッド（loadNotes, saveNote, deleteNote, subscribeNotes）を
     * Firestoreの関数（getDocs, setDoc, deleteDoc, onSnapshot）に書き換えるだけで
     * UI側のコードを変更せずにPC・スマホ間でリアルタイム同期できます。
     * =========================================================================
     */
    const StorageService = {
      STORAGE_KEY: 'mellow_note_data_v1',

      // 全メモを取得
      async loadNotes() {
        const raw = localStorage.getItem(this.STORAGE_KEY);
        if (!raw) {
          // 初回起動時のサンプルメモ
          const initialNotes = [
            {
              id: 'welcome-note-1',
              title: 'Mellow Noteへようこそ ☕',
              body: 'ここは、日々のちょっとした気づきや大切なことを書き留めるシンプルなメモ帳です。\n\n・入力した内容は自動で保存されます\n・大切なメモは右上の「ピン留め」で一番上に固定できます\n・PCでもスマホでも見やすい画面サイズに自動調整されます\n\nのちにFirebaseと連携すると、PCとスマホで同じメモをリアルタイムに共有できるようになります。',
              isPinned: true,
              createdAt: Date.now(),
              updatedAt: Date.now()
            }
          ];
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(initialNotes));
          return initialNotes;
        }
        return JSON.parse(raw);
      },

      // メモを保存（新規作成・更新共通）
      async saveNote(note) {
        const notes = await this.loadNotes();
        const index = notes.findIndex(n => n.id === note.id);
        if (index > -1) {
          notes[index] = note;
        } else {
          notes.unshift(note);
        }
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(notes));
        return note;
      },

      // メモを削除
      async deleteNote(noteId) {
        const notes = await this.loadNotes();
        const filtered = notes.filter(n => n.id !== noteId);
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(filtered));
      }
    };

    /**
     * =========================================================================
     * アプリケーション状態・UI制御
     * =========================================================================
     */
    const state = {
      notes: [],
      activeNoteId: null,
      searchQuery: '',
      saveTimer: null
    };

    // DOM要素の取得
    const els = {
      appContainer: document.getElementById('appContainer'),
      noteList: document.getElementById('noteList'),
      noteCountLabel: document.getElementById('noteCountLabel'),
      searchInput: document.getElementById('searchInput'),
      btnNewNote: document.getElementById('btnNewNote'),
      editorWrapper: document.getElementById('editorWrapper'),
      noNoteView: document.getElementById('noNoteView'),
      btnBack: document.getElementById('btnBack'),
      statusDot: document.getElementById('statusDot'),
      saveStatusText: document.getElementById('saveStatusText'),
      btnPin: document.getElementById('btnPin'),
      pinBtnText: document.getElementById('pinBtnText'),
      btnDelete: document.getElementById('btnDelete'),
      editorDateInfo: document.getElementById('editorDateInfo'),
      inputTitle: document.getElementById('inputTitle'),
      inputBody: document.getElementById('inputBody'),
      charCount: document.getElementById('charCount')
    };

    // 日時フォーマット（例: 2026/11/22 13:05）
    function formatDate(timestamp) {
      const d = new Date(timestamp);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${day} ${h}:${min}`;
    }

    // メモの並び替え（ピン留め優先 ＞ 更新日時が新しい順）
    function sortNotes(notes) {
      return [...notes].sort((a, b) => {
        if (a.isPinned !== b.isPinned) {
          return a.isPinned ? -1 : 1;
        }
        return b.updatedAt - a.updatedAt;
      });
    }

    // メモ一覧の描画
    function renderNoteList() {
      const query = state.searchQuery.trim().toLowerCase();
      const sorted = sortNotes(state.notes);
      const filtered = query
        ? sorted.filter(n =>
            (n.title && n.title.toLowerCase().includes(query)) ||
            (n.body && n.body.toLowerCase().includes(query))
          )
        : sorted;

      els.noteCountLabel.textContent = query
        ? `検索結果 (${filtered.length}件)`
        : `すべてのメモ (${state.notes.length}件)`;

      els.noteList.innerHTML = '';

      if (filtered.length === 0) {
        els.noteList.innerHTML = `
          <div class="empty-list">
            ${query ? '一致するメモが見つかりませんでした。' : 'メモがまだありません。<br>右上の「＋ 新規メモ」から作成できます。'}
          </div>
        `;
        return;
      }

      filtered.forEach(note => {
        const card = document.createElement('div');
        card.className = `note-card ${note.id === state.activeNoteId ? 'active' : ''}`;
        
        const displayTitle = note.title.trim() || '無題のメモ';
        const displayPreview = note.body.trim().replace(/\n/g, ' ') || '本文なし';

        card.innerHTML = `
          <div class="note-card-header">
            <div class="note-card-title">${escapeHtml(displayTitle)}</div>
            ${note.isPinned ? '<span class="pin-badge" title="ピン留め中">📌</span>' : ''}
          </div>
          <div class="note-card-preview">${escapeHtml(displayPreview)}</div>
          <div class="note-card-date">${formatDate(note.updatedAt)}</div>
        `;

        card.addEventListener('click', () => selectNote(note.id));
        els.noteList.appendChild(card);
      });
    }

    // HTMLエスケープ（XSS対策）
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // メモを選択してエディタに表示
    function selectNote(noteId, isMobileOpen = true) {
      state.activeNoteId = noteId;
      const note = state.notes.find(n => n.id === noteId);

      if (!note) {
        els.editorWrapper.style.display = 'none';
        els.noNoteView.style.display = 'flex';
        renderNoteList();
        return;
      }

      els.noNoteView.style.display = 'none';
      els.editorWrapper.style.display = 'flex';

      els.inputTitle.value = note.title;
      els.inputBody.value = note.body;
      els.editorDateInfo.textContent = `最終更新: ${formatDate(note.updatedAt)}`;
      updateCharCount(note.body);
      updatePinButton(note.isPinned);
      setSaveStatus('saved');

      renderNoteList();

      if (isMobileOpen) {
        els.appContainer.classList.add('mobile-editing');
      }
    }

    // ピン留めボタンの表示更新
    function updatePinButton(isPinned) {
      if (isPinned) {
        els.btnPin.classList.add('pinned');
        els.pinBtnText.textContent = '固定中';
      } else {
        els.btnPin.classList.remove('pinned');
        els.pinBtnText.textContent = 'ピン留め';
      }
    }

    // 文字数カウント更新
    function updateCharCount(text) {
      const count = text.length;
      els.charCount.textContent = `${count.toLocaleString()} 文字`;
    }

    // 保存ステータス表示
    function setSaveStatus(status) {
      if (status === 'saving') {
        els.statusDot.classList.add('saving');
        els.saveStatusText.textContent = '保存中...';
      } else {
        els.statusDot.classList.remove('saving');
        els.saveStatusText.textContent = '保存済み';
      }
    }

    // 新規メモ作成
    async function createNewNote() {
      const now = Date.now();
      const newNote = {
        id: 'note-' + now + '-' + Math.random().toString(36).substring(2, 7),
        title: '',
        body: '',
        isPinned: false,
        createdAt: now,
        updatedAt: now
      };

      await StorageService.saveNote(newNote);
      state.notes.unshift(newNote);
      selectNote(newNote.id, true);
      els.inputTitle.focus();
    }

    // 現在のメモを自動保存（デバウンス処理）
    function handleEditorInput() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;

      note.title = els.inputTitle.value;
      note.body = els.inputBody.value;
      note.updatedAt = Date.now();

      updateCharCount(note.body);
      setSaveStatus('saving');
      renderNoteList();

      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(async () => {
        await StorageService.saveNote(note);
        els.editorDateInfo.textContent = `最終更新: ${formatDate(note.updatedAt)}`;
        setSaveStatus('saved');
      }, 400);
    }

    // ピン留め切り替え
    async function togglePin() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;

      note.isPinned = !note.isPinned;
      note.updatedAt = Date.now();
      await StorageService.saveNote(note);

      updatePinButton(note.isPinned);
      renderNoteList();
    }

    // メモ削除
    async function deleteCurrentNote() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;

      const title = note.title.trim() || '無題のメモ';
      if (!confirm(`「${title}」を削除しますか？\nこの操作は取り消せません。`)) {
        return;
      }

      await StorageService.deleteNote(note.id);
      state.notes = state.notes.filter(n => n.id !== note.id);
      state.activeNoteId = null;

      els.appContainer.classList.remove('mobile-editing');
      selectNote(null, false);
    }

    // イベントリスナー登録
    function bindEvents() {
      els.btnNewNote.addEventListener('click', createNewNote);
      els.inputTitle.addEventListener('input', handleEditorInput);
      els.inputBody.addEventListener('input', handleEditorInput);
      els.btnPin.addEventListener('click', togglePin);
      els.btnDelete.addEventListener('click', deleteCurrentNote);

      els.searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderNoteList();
      });

      // スマホ画面で一覧へ戻る
      els.btnBack.addEventListener('click', () => {
        els.appContainer.classList.remove('mobile-editing');
        state.activeNoteId = null;
        renderNoteList();
      });
    }

    // 初期化処理
    async function init() {
      bindEvents();
      state.notes = await StorageService.loadNotes();
      renderNoteList();

      // PC画面幅の場合は最初のメモを自動で開く
      if (window.innerWidth > 768 && state.notes.length > 0) {
        const sorted = sortNotes(state.notes);
        selectNote(sorted[0].id, false);
      }
    }

    init();
  </script>
</body>
</html>
